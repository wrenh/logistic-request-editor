sort-direction-tooltip=__1__. Click to reverse the sort direction.
sort-tooltip=Choose the primary sort for each selected section. Default keeps the complete native item order and hides the secondary sort. Other properties may use a secondary tie-breaker. Up means ascending; down means descending. Click an arrow to reverse its priority's direction. Remaining ties use native order in the primary direction. Sorts use final edited values. Nothing changes until Apply; Undo restores the previous order.
secondary-sort-tooltip=Sort only items tied on the primary value. None uses no secondary priority. The primary property is omitted here. Default is available only when the two directions differ, because matching directions would repeat the existing native tie-breaker.
secondary-sort-cleared=Secondary sort cleared to None because it duplicated the primary property or the existing native tie-breaker. No requests were changed.
sort-priorities-duplicate=Primary and secondary sorts cannot use the same property. No requests were changed.
sort-default-redundant=Secondary Default must use the opposite direction from the primary sort. Matching directions already use the native tie-breaker. No requests were changed.
clear-empty-slots=Clear empty slots
clear-empty-slots-tooltip=When sorting is enabled, move requests into consecutive slots starting at slot 1, removing empty gaps and trailing empty entries. Item requests with Requested = 0 are kept. All request settings move with their item. Uncheck to preserve empty-slot positions. Nothing changes until Apply; Undo restores the original gaps.
sort-units-tooltip=Both sorting priorities share this numeric unit. Items compares raw counts; Stacks compares counts divided by each item's stack size. This does not change quantity-edit units.
select-sort=Choose a primary sort, a valid optional secondary sort, their directions, and a unit. No requests were changed.
sort-names-pending=Loading displayed item names for sorting. Apply will be available when translations finish.
sort-name-failed=An item name could not be translated. Reopen the editor to retry Name sorting, or choose another sort. No requests were changed.
sort-planet-unavailable=A request's import planet is no longer available. No requests were changed.
share-capacity=Balance requests
share-custom=Custom
share-tooltip=Balance in the unit selected beside Requested. Stacks gives each item/quality an equal whole-stack allocation. Items gives each type an equal whole-item target that fits, allowing partial stacks. Spare capacity is not redistributed. Filtered/reserved slots and other active requests reserve space first. Duplicate requests and section multipliers share their type's allocation. Existing Trash above is preserved unless below the new Requested amount. Nothing changes until Apply.
share-preview=__1__ stacks per item/quality across __2__ types. __3__ of __4__ slots reserved by other requests. Per-request values account for duplicates and multipliers.
share-preview-items=__1__ items per item/quality across __2__ types. __3__ of __4__ slots reserved by other requests. Partial stacks are allowed; per-request values account for duplicates and multipliers.
share-filtered-slots=Reserved inventory slots counted as taken: __1__. Their filters and contents are unchanged.
share-trash-note=Keep existing Trash above; raise it only when below the new Requested amount. Custom restores your previous amount draft.
capacity-unavailable=This requester's main inventory capacity is unavailable. No requests were changed.
capacity-unsupported-request=An unedited request cannot be included safely in the capacity calculation. No requests were changed.
capacity-inactive=Balancing requests requires an active, positive-multiplier section or active linked copy in this inventory. No requests were changed.
capacity-no-types=No selected item types can have positive Requested counts under the current quality conditions. No requests were changed.
capacity-insufficient=Reserved inventory slots, other requests, or section multipliers leave insufficient capacity for the selected types. No requests were changed.
payload-label=Minimum payload
units-items=Items
units-stacks=Stacks
units-tooltip=Items applies the same count to every item. Stacks uses each item's stack size. Changing units keeps the entered number.
amount-units-tooltip=Custom amounts: Items applies the same count to every item; Stacks uses each item's stack size. Changing units keeps your custom number. During Balance requests, switching units recalculates equal item-count or whole-stack targets instead.
payload-tooltip=Minimum items per delivery, independently of Requested and Trash above. Use Items or Stacks; each resulting count must be between 1 and 4294967295. This does not increase a rocket's carrying capacity.
payload-slider-tooltip=Stops: 1, 2, 3, 4, 5, 10, 25, 50, 100, 1000 in the selected unit. Type other whole positive amounts in the box.
select-amount-units=Choose Items or Stacks beside Requested. The choice also applies to Trash above. No requests were changed.
select-payload-units=Choose Items or Stacks for minimum payload. No requests were changed.
invalid-payload=Minimum payload must be a whole positive amount from 1 to 4294967295. No requests were changed.
payload-overflow=Minimum payload exceeds 4294967295 items for __1__. No requests were changed.
quality-comparator-tooltip=Compare item quality with the selected level, or select Any for any quality. Non-exact filters require Requested = 0. Quality-range behavior: __1__.
quality-policy-prevent=Prevent
quality-policy-zero=Set to 0
quality-zeroed=Requested was set to 0 for __1__ filters to allow multiple qualities. Trash above was not changed by this rule.
quality-locked=__1__ (not unlocked)
quality-unavailable=The selected quality is not unlocked or available. No requests were changed.
select-quality=Select exactly one quality. No requests were changed.
select-quality-comparator=Select a quality comparison. No requests were changed.
quality-duplicate=Changing quality would create duplicate requests for __1__ in a section. No requests were changed.
requested=Requested
trash_above=Trash above
requested-tooltip=Whole amounts in the selected unit. Each item's resulting count must be at most 2147483647. Typed values above the last preset are kept while the slider stays at its last stop. Balance requests stages per-type allocations in the selected unit rather than a uniform custom amount.
maximum-tooltip=Whole amounts in the selected unit, or inf. for unlimited. Cannot be less than Requested. Each finite item count must be at most 2147483647.
slider-tooltip=Stops: __1__ (__2__). Stack mode inserts the usable main-inventory slot count if missing; higher presets remain available. Trash above replaces its final stop with inf. Type other whole amounts in the box.
apply=Apply
undo=Undo
undo-tooltip=Restore request values from just before the last successful Apply in this window. Closing the window discards Undo.
undone=Restored __1__ item requests from before the last Apply.
nothing-to-undo=There is no Apply to undo in this window. No requests were changed.
undo-conflict=Requests changed after Apply, or an edited section changed or was removed. Undo was not applied. No requests were changed.
apply-tooltip=Apply only checked edit categories to the selected sections. Keep item types and section multipliers unchanged.
