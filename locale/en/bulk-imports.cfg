[mod-setting-description]
logistic-request-editor-show-editor=The same show/hide choice as the shortcut and editor X button. When enabled, supported inventories open the editor automatically. No requests change until Apply.
logistic-request-editor-placement=Choose a docking edge or a floating window. Changing this moves an open editor while preserving its form and Undo. Use Floating or the reset-position keybind to recover an off-screen panel.
logistic-request-editor-floating-locked=Prevent title-bar dragging while floating. The editor's padlock button shows the current state and updates this setting.
logistic-request-editor-remember-position=Reuse the last dragged floating position. Disable this to center new floating windows. Turning it off also recenters an open floating editor.
logistic-request-editor-default-selection=Used for a fresh editor. Multiple initially checks only the first editable section, if one exists.
logistic-request-editor-default-units=Items applies the same count to every item; Stacks uses each item's stack size. The single selector beside Requested also controls Trash above.
logistic-request-editor-default-requested=Whole amount in the default Requested / Trash above unit. The resulting per-item count must not exceed 2147483647.
logistic-request-editor-default-requested-mode=Custom uses the numeric option below in your default unit. Max opens a fresh editor in Stacks mode with Requested set to the usable main-inventory slot count, respecting its bar and current size bonuses. Chests have an independent default.
logistic-request-editor-default-chest-requested-mode=Used for requester and buffer chests. Max opens in Stacks mode with Requested equal to the current usable slot count (48 for a normal unrestricted requester chest). Custom uses the chest numeric option below.
logistic-request-editor-default-chest-requested=Whole amount in your default unit when the chest default is Custom. The resulting per-item count must not exceed 2147483647.
logistic-request-editor-default-maximum=Enter a nonnegative whole amount in the default unit, or inf. for unlimited. The editor validates this when amount editing is enabled.
logistic-request-editor-default-payload-units=Minimum payload has its own Items / Stacks choice, independent of Requested and Trash above.
logistic-request-editor-default-payload=Enter a positive whole amount. Each resulting payload must be at most 4294967295 items. This is a text option to support the full unsigned range; the editor validates it.
logistic-request-editor-default-edit-filters=Choose the initial state of the platform import-filter edit category. Hidden for other inventories. Applies only to a fresh editor.
logistic-request-editor-default-platform-amounts=Choose the initial state of amount editing for platform requests. Applies only to a fresh editor.
logistic-request-editor-default-other-amounts=Choose the initial state of amount editing for personal requests, requester/buffer chests, logistics-capable vehicles and cargo landing pads.
logistic-request-editor-default-edit-quality=Choose the initial state of quality editing for every supported inventory. Applies only to a fresh editor.
logistic-request-editor-default-edit-payload=Choose the initial state of minimum payload editing on platforms. Hidden for other inventories. Applies only to a fresh editor.
logistic-request-editor-sort=Enabled starts Sort checked; Disabled leaves it unchecked; Hidden removes it from the panel and excludes sorting from Apply. Visible defaults apply to fresh editors. Default sorting follows native item ordering metadata.
logistic-request-editor-default-clear-empty-slots=Initial state of Clear empty slots inside Sort. Enabled packs sorted requests into consecutive slots, without removing item requests that have Requested = 0. Applies to fresh editors only. Sorting must be enabled, and nothing changes until Apply.
logistic-request-editor-edit-filters=Enabled starts Edit filters checked; Disabled leaves it unchecked; Hidden removes the category and excludes it from Apply. Platform-only. Visible defaults apply to fresh editors; hiding applies immediately.
logistic-request-editor-edit-platform-amounts=Enabled starts Edit amounts checked on platforms; Disabled leaves it unchecked; Hidden removes the category and excludes it from Apply. Visible defaults apply to fresh editors; hiding applies immediately.
logistic-request-editor-edit-other-amounts=Enabled starts Edit amounts checked for personal requests, requester/buffer chests, vehicles and landing pads; Disabled leaves it unchecked; Hidden removes it and excludes it from Apply. Visible defaults apply to fresh editors; hiding applies immediately.
logistic-request-editor-edit-quality=Enabled starts Edit quality checked; Disabled leaves it unchecked; Hidden removes the category and excludes it from Apply. Visible defaults apply to fresh editors; hiding applies immediately.
logistic-request-editor-edit-payload=Enabled starts Edit minimum payload checked; Disabled leaves it unchecked; Hidden removes the category and excludes it from Apply. Platform-only. Visible defaults apply to fresh editors; hiding applies immediately.
logistic-request-editor-quality-range-behavior=Non-exact quality comparisons and Any quality cannot have a positive requested amount. Prevent refuses the entire Apply batch. Set to 0 automatically zeros Requested when quality or amount edits affect a range filter, even if Edit amounts is unchecked. This rule does not alter Trash above; that still follows Edit amounts. Nothing changes until Apply, and Undo restores the previous values.
logistic-request-editor-confirmation-seconds=Game-time seconds before successful Apply / Undo messages disappear. Applies to subsequent confirmations. Validation errors do not expire.

