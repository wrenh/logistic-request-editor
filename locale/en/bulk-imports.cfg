invalid-maximum=Trash above must be a nonnegative whole amount up to 2147483647, or inf. for unlimited. Each finite item count must be within that limit. No requests were changed.
invalid-amount-range=Trash above cannot be less than Requested. No requests were changed.
amount-non-item=Only item requests support sorting, amount, quality, or payload edits. No requests were changed.
amount-quality-range=__1__ has a quality-range condition. Requested must be 0 for that condition. No requests were changed.
amount-overflow=The selected amounts exceed 2147483647 items for __1__. No requests were changed.
