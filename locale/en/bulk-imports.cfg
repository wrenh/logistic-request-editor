select-sections=Check at least one request section first. No requests were changed.
select-mode=Select Single or Multiple request sections. No requests were changed.
select-edits=Enable Sort, Edit filters, Edit amounts, Edit quality, Edit minimum payload, or a combination. No requests were changed.
select-amounts=Enable Edit amounts or Edit quality first. No requests were changed.
